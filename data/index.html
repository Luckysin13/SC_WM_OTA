<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f97316">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Smoker">
    <title>Smoker Controller Dashboard</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="/icon-192.svg">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <!-- Navigation Header -->
    <div class="navbar">
        <div tabindex="0" class="menu">
            <label>Smoker Controller</label>
            <div class="menu-dropdown">
                <a href="index.html">Home</a>
                <a href="wifi.html">Wifi Setup</a>
                <a href="alarms.html">Alarms</a>
                <a href="graph.html">Temperature Graph</a>
                <a href="configuration.html">Configuration</a>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="content">
        <!-- WiFi Status Bar -->
        <div class="wifi-status-bar">
            <div class="wifi-info">
                <div class="wifi-item">
                    <span class="wifi-label">Mode:</span>
                    <span id="wifi-indicator"></span>
                    <span id="wifi-mode" class="wifi-value">--</span>
                </div>
                <div class="wifi-divider"></div>
                <div class="wifi-item">
                    <span class="wifi-label">Network:</span>
                    <span id="wifi-ssid" class="wifi-value">--</span>
                </div>
                <div class="wifi-divider"></div>
                <div class="wifi-item">
                    <span class="wifi-label">Signal:</span>
                    <span id="wifi-signal" class="wifi-value">--</span>
                </div>
            </div>
        </div>

        <div class="box-grid">
            <!-- Meat Temperature Card -->
            <section class="box" role="region" aria-labelledby="meat-temp-title">
                <h2 id="meat-temp-title" class="box-title">Meat Temp <span id="lblMeatDone" style="font-size: 0.8em; color: #10b981;"></span></h2>
                <p id="box0" class="currentValue" aria-live="polite">
                    <span id="boxValue0">--</span> &#8457;
                </p>
            </section>

            <!-- Pit Temperature Card -->
            <section class="box" role="region" aria-labelledby="pit-temp-title">
                <h2 id="pit-temp-title" class="box-title">Pit Temp</h2>
                <p id="box1" class="currentValue" aria-live="polite">
                    <span id="boxValue1">--</span> &#8457;
                </p>
            </section>



            <!-- Pit Setpoint Card -->
            <section class="box" role="region" aria-labelledby="setpoint-title">
                <h2 id="setpoint-title" class="box-title">Pit Setpoint <span id="lblSetpoint"
                        style="font-size: 0.8em; color: #10b981;"></span></h2>
                <label for="box2" class="visually-hidden">Target temperature setpoint</label>
                <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <input type="text" id="box2" class="setpoint-input" min="160" max="450" step="1" value=""
                        maxlength="3" size="7" inputmode="numeric" pattern="[0-9]*" onfocus="this.value=''"
                        onkeydown="if(event.key==='Enter') { this.blur(); updateBox(this); }"
                        aria-label="Target temperature setpoint in Fahrenheit" aria-describedby="setpoint-hint"
                        style="height: 70px; font-size: 30px;" />
                    <button class="save-btn" style="height: 70px; font-size: 24px; padding: 0 20px;"
                        onclick="updateBox(document.getElementById('box2'))">SET</button>
                </div>
                <span id="setpoint-hint" class="visually-hidden">Enter a value between 160-450 degrees Fahrenheit</span>
            </section>

            <!-- Fan Speed Card -->
            <section class="box" role="region" aria-labelledby="fan-speed-title">
                <div class="fan-header">
                    <h2 id="fan-speed-title" class="box-title">Fan Speed</h2>
                    <button id="fanModeBtn" class="fan-mode-btn" type="button" aria-pressed="false">AUTO</button>
                </div>
                <p id="box3" class="currentValue" aria-live="polite">
                    <span id="boxValue3">--</span> &percnt;
                </p>
            </section>
        </div>
    </main>

    <!-- Hidden value for setpoint tracking -->
    <p class="hiddenValue" id="boxValue2" aria-hidden="true"></p>

    <!-- OTA Reboot Modal -->
    <div id="otaRebootModal" class="ota-modal-overlay" style="display: none;">
        <div class="ota-modal-content">
            <div class="ota-modal-icon">✓</div>
            <h2 class="ota-modal-title">Update Complete!</h2>
            <p class="ota-modal-message">Firmware installed successfully.<br>The device is now rebooting.</p>
            <p class="ota-modal-version" id="otaNewVersion"></p>
            <button class="ota-modal-btn" onclick="reloadPage()">OK</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="script.js" defer></script>
    <script>
        // Register Service Worker for PWA support (HTTP only - self-signed HTTPS certs not supported)
        if ('serviceWorker' in navigator && location.protocol === 'http:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js?v=3.0.9')
                    .then(reg => console.log('[PWA] Service Worker registered'))
                    .catch(err => console.log('[PWA] Service Worker registration failed:', err));
            });
        }
    </script>
</body>

</html>
