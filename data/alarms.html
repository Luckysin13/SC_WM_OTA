<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Temp Controller - Alarms</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f97316">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="/icon-192.svg">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body class="alarms-page">
    <div class="navbar">
        <div tabindex="0" class="menu">
            <label>Alarms</label>
            <div class="menu-dropdown">
                <a href="index.html">Home</a>
                <a href="wifi.html">Wifi Setup</a>
                <a href="alarms.html">Alarms</a>
                <a href="graph.html">Temperature Graph</a>
                <a href="configuration.html">Configuration</a>
            </div>
        </div>
    </div>
    <main class="content">
        <!-- WiFi Status Bar -->
        <div class="wifi-status-bar">
            <div class="wifi-info">
                <div class="wifi-item">
                    <span class="wifi-label">Mode:</span>
                    <span id="wifi-indicator"></span>
                    <span id="wifi-mode" class="wifi-value">--</span>
                </div>
                <div class="wifi-divider"></div>
                <div class="wifi-item">
                    <span class="wifi-label">Network:</span>
                    <span id="wifi-ssid" class="wifi-value">--</span>
                </div>
                <div class="wifi-divider"></div>
                <div class="wifi-item">
                    <span class="wifi-label">Signal:</span>
                    <span id="wifi-signal" class="wifi-value">--</span>
                </div>
            </div>
        </div>

        <div class="page-header">
            <h1 class="page-title">Alarm Settings</h1>
            <p class="page-subtitle">Configure alerts and safety features for your cook.</p>
        </div>
        <div class="box-grid alarms-grid">
            <section class="box alarm-card">
                <div class="alarm-header">
                    <div>
                        <div class="alarm-title">Done Alarm</div>
                        <div class="alarm-subtitle">Alert when meat reaches the target temperature.</div>
                    </div>
                    <label class="alarm-toggle" for="boxValue6">
                        <span>Enabled</span>
                        <input class="boxchecksize" type="checkbox" id="boxValue6" name="DoneAlarm" value="yes"
                            onclick="updateCheckbox()">
                    </label>
                </div>
                <div class="alarm-body">
                    <div class="alarm-row">
                        <label class="alarm-label" for="box8">Meat Done Temp</label>
                        <div class="alarm-input-group">
                            <input type="text" id="box8" class="setpoint-input alarm-input" min="32" max="225" step="1"
                                value="" maxlength="3" size="5" inputmode="numeric" pattern="[0-9]*" onfocus="this.value=''"
                                onkeydown="if(event.key==='Enter') { this.blur(); updateBox(this); }" />
                            <button class="save-btn alarm-btn" onclick="updateBox(document.getElementById('box8'))">Set</button>
                        </div>
                    </div>
                    <div class="alarm-row">
                        <label class="alarm-label" for="boxValue4" style="display: flex; align-items: center; gap: 8px;">
                            Keep Warm
                            <input class="boxchecksize" type="checkbox" id="boxValue4" name="KeepWarm" value="yes"
                                onclick="updateCheckbox()">
                        </label>
                        <div class="alarm-input-group">
                            <input type="text" id="box9" class="setpoint-input alarm-input" min="160" max="450" step="1"
                                value="" maxlength="3" size="5" inputmode="numeric" pattern="[0-9]*" onfocus="this.value=''"
                                onkeydown="if(event.key==='Enter') { this.blur(); updateBox(this); }" />
                            <button class="save-btn alarm-btn" onclick="updateBox(document.getElementById('box9'))">Set</button>
                        </div>
                        <div class="alarm-hint">Enable keep warm to hold a safe temperature after the alarm triggers.</div>
                    </div>
                </div>
            </section>

        </div>
    </main>
    <script src="script.js" defer></script>
    <script>
        if ('serviceWorker' in navigator && location.protocol === 'http:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js?v=3.0.8')
                    .then(reg => console.log('[PWA] Service Worker registered'))
                    .catch(err => console.log('[PWA] SW registration failed:', err));
            });
        }
    </script>
</body>

</html>
