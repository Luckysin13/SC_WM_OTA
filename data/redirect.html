<!DOCTYPE html>
<html lang="en">

<head>
	<title>Temp Controller</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/png" href="favicon.png">
	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
	<div class="navbar">
		<div tabindex="0" class="menu"><label>Temp Controller</label></div>
	</div>
	<div class="content">
		<div class="box-grid">
			<div class="box-redirect">
				<p style="font-size: 18px; margin-bottom: 20px;">Configuration Saved!</p>
				<p>The controller is restarting and connecting to your router.</p>
				<div
					style="margin-top: 15px; margin-bottom: 20px; text-align: left; background: var(--secondary-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color);">
					<h3 style="margin-top: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">
						Settings Summary</h3>
					<p style="margin: 5px 0;"><strong>SSID:</strong> %SSID%</p>
					<p style="margin: 5px 0;"><strong>IP Mode:</strong> %IP_MODE%</p>
					<p style="margin: 5px 0;"><strong>IP Address:</strong> %IP_ADDRESS%</p>
					<p style="margin: 5px 0;"><strong>Gateway:</strong> %GATEWAY%</p>
					<a href="http://Smoker.local" target="_blank">Click Here or goto http://Smoker.local</a> 

				</div>
				<div style="margin-top: 20px;">
					%IP_MSG%
				</div>
			</div>
		</div>
	</div>
</body>

</html>
