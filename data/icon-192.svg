<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="smokeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="96" cy="96" r="92" fill="#1a1a2e"/>
  <!-- Smoker body -->
  <ellipse cx="96" cy="120" rx="50" ry="30" fill="#374151"/>
  <rect x="46" y="75" width="100" height="45" rx="8" fill="#4b5563"/>
  <!-- Lid -->
  <ellipse cx="96" cy="75" rx="50" ry="15" fill="#6b7280"/>
  <ellipse cx="96" cy="72" rx="45" ry="12" fill="#9ca3af"/>
  <!-- Thermometer -->
  <circle cx="96" cy="90" r="12" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
  <line x1="96" y1="90" x2="96" y2="82" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <line x1="96" y1="90" x2="102" y2="93" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <!-- Smoke wisps -->
  <path d="M80 55 Q75 45 80 35 Q85 25 80 15" stroke="url(#smokeGrad)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M96 50 Q91 40 96 30 Q101 20 96 10" stroke="url(#smokeGrad)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M112 55 Q107 45 112 35 Q117 25 112 15" stroke="url(#smokeGrad)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- Legs -->
  <rect x="55" y="150" width="8" height="25" rx="2" fill="#374151"/>
  <rect x="129" y="150" width="8" height="25" rx="2" fill="#374151"/>
</svg>
